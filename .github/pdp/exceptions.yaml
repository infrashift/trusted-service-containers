    justification: >-
      RHEL fixed these 14 krb5-libs Highs in 1.21.1-10.el9_9.2, but on
      2026-11-14 the newest krb5-libs in the UBI repositories was
      1.21.1-10.el9_8.1, which the image already installs: the Containerfile
      upgrades the base from UBI before it installs PostgreSQL. krb5-libs is a
      base package that libpq and the server link, so it cannot be removed.
      No rebuild or re-pin clears it until UBI publishes the build. 30 days,
      because UBI already carries other el9_9 builds; rebuild and delete this
      entry when it does.

