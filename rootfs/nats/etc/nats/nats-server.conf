# Trusted NATS server defaults.
#
# OURS, not upstream's. The nats-docker image ships a config containing a
# cluster block with hardcoded credentials (ruser / T0pS3cr3t). Baking those
# into an image called "trusted" would be indefensible, so this file is written
# from scratch, reviewed in git, and covered by CODEOWNERS.
#
# Override by mounting your own config over /etc/nats/nats-server.conf, or by
# passing `-c /path/to/your.conf` — an explicit command overrides the CMD.

# ---------------------------------------------------------------------------
# Identity and listeners
# ---------------------------------------------------------------------------
# Left to the environment so a StatefulSet can give each pod a stable identity.
# NATS substitutes $VAR from the process environment.
server_name: $NATS_SERVER_NAME

port: 4222          # client connections

# HTTP monitoring endpoint (/varz, /healthz, /connz). Bind it to a private
# interface or a NetworkPolicy in production: it is unauthenticated by design
# and exposes connection and subject metadata.
http: 8222

# ---------------------------------------------------------------------------
# JetStream
# ---------------------------------------------------------------------------
# store_dir is /var/lib/nats and NATS creates <store_dir>/jetstream beneath it
# (verified empirically via /varz), so the data lands at /var/lib/nats/jetstream.
# The VOLUME is /var/lib/nats -- the directory NATS actually owns.
# Without a persistent mount here, streams and consumers are lost on restart —
# and the failure is silent until something restarts.
jetstream {
  store_dir: "/var/lib/nats"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# ---------------------------------------------------------------------------
# Limits
# ---------------------------------------------------------------------------
max_payload: 1MB
max_connections: 1000
max_control_line: 4KB
max_pending: 64MB
write_deadline: "10s"
ping_interval: "2m"
ping_max: 2

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logtime: true
debug: false
trace: false

# ---------------------------------------------------------------------------
# NOT CONFIGURED HERE, deliberately
# ---------------------------------------------------------------------------
# authorization / accounts / operator:
#   NATS defaults to OPEN ACCESS on port 4222. There is no credential in this
#   file and no way for a base image to invent a sensible one — an embedded
#   default would either be a shared secret (worse than none) or a placeholder
#   everyone forgets to change. Supply an auth model before exposing this
#   beyond a trusted network. See docs/build-track/runtime.md.
#
# cluster / gateway / leafnodes:
#   These need per-deployment routes and credentials. Add them in your own
#   mounted config; the image ships none so nothing false is baked in.
#
# tls:
#   Certificates are deployment-specific. The image DOES carry a CA trust
#   bundle so outbound TLS verification works; inbound TLS is yours to define.
