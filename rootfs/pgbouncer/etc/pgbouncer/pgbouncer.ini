;; Trusted PgBouncer defaults.
;;
;; OURS, written for this image. Everything not set here is the PgBouncer
;; default. The entrypoint is `pgbouncer` and the default argument is this
;; file, so a container started with another path uses that file instead:
;;
;;   podman run -v ./pgbouncer:/etc/pgbouncer:ro,Z <image>
;;   podman run -v ./conf:/conf:ro,Z <image> /conf/pgbouncer.ini
;;
;; This file serves no database and its auth file is empty: the pooler starts
;; and listens, but every login fails until you mount your own configuration.
;; For TLS set client_tls_sslmode, client_tls_key_file, client_tls_cert_file
;; (and server_tls_* towards PostgreSQL); the binary links the UBI OpenSSL.

[databases]

[pgbouncer]
;; Every interface, the PgBouncer port. 6432 is above 1024, so UID 1001 needs
;; no capability.
listen_addr = *
listen_port = 6432

;; No unix socket: the container is reached over TCP, and a socket would need
;; a writable directory.
unix_socket_dir =

;; SCRAM only. The auth file is empty, so nobody can log in.
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

;; Logs go to stderr for the container runtime. No pid file: the container
;; runtime tracks the process.
logfile =
pidfile =
