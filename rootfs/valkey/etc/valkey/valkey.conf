# Trusted Valkey defaults.
#
# OURS, written for this image. Everything not set here is the Valkey
# default. The entrypoint is `valkey-server /etc/valkey/valkey.conf`, so any
# argument passed to the container is appended to this file and overrides it:
#
#   persistence off      --save "" --appendonly no
#   a password           --requirepass "$VALKEY_PASSWORD"   (or an ACL file)
#   TLS                  --tls-port 6380 --port 0 --tls-cert-file ... \
#                        --tls-key-file ... --tls-ca-cert-file ...
#
# Or mount your own file over /etc/valkey/valkey.conf.

# Listen on every interface, IPv4 and IPv6 (the leading `-` makes IPv6
# optional, so the server still starts on a host without it).
bind * -::*
port 6379

# Protected mode stays ON. With no password and no ACL user, Valkey refuses
# every client that is not on the loopback interface. Set a password or an
# ACL to serve the network; never turn protected mode off instead.
protected-mode yes

# The volume. RDB snapshots and the AOF directory live here, and the server
# runs with it as its working directory.
dir /data

# Logs go to stdout for the container runtime.
logfile ""

# A container has no init system to notify.
supervised no
daemonize no
